apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-inventoryaggregator
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: inventoryaggregator
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 1Gi

