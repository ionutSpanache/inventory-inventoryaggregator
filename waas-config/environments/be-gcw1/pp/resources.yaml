apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-inventoryaggregator
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: inventoryaggregator
        resources:
          limits:
            cpu: "2"
            memory: 3Gi
          requests:
            cpu: "1"
            memory: 1.2Gi

