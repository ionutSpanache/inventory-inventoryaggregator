apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-inventoryaggregator
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: inventoryaggregator
        resources:
          limits:
            cpu: "3"
            memory: 4.5Gi
          requests:
            cpu: "0.5"
            memory: 2Gi
