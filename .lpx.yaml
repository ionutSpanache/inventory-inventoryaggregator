customer: mcc
vertical: inventory
# This feature is currently not documented,
# but it is far more easier, then installing
# Here we install curl in our image
# It's not used and only meant for demo purposes
#install:
#- apt-get update && apt-get install -y curl
# We use the checked in maven wrapper, to not rely on the package manager
multistage: true
services:
- id: inventoryaggregator
  type: dockerfile
  check: true
  secret: true
  probe:
    initialdelay: 180
    period: 10
  # These are the defaults and
  # needs to be enhanced for most services
  perStageConfiguration: true
  stageConfig:
    dev:
      replicas: 1
      resources:
        requests:
          memory: "280Mi"
          cpu: "100m"
        limits:
          memory: "812Mi"
          cpu: "0.5"
    pp:
      replicas: 3
      resources:
        requests:
          memory: "1.1Gi"
          cpu: "1"
        limits:
          memory: "2Gi"
          cpu: "1.5"
    prod:
      replicas: 6
      resources:
        requests:
          memory: "1.2Gi"
          cpu: "0.1"
        limits:
          memory: "2Gi"
          cpu: "0.8"
# Specifies the files executed for tests on each environment. Need to be executable 'chmod +x'
tests:
# - stage: dev
#   test: ./scripts/stop_pipeline.sh
# - stage: pp
#   test: ./scripts/stop_pipeline.sh
watchers:
  - alin.ciubotariu01@metrosystems.net
  - george.dumitrascu@metrosystems.net
  - cristiangabriel.jena@metrosystems.net


