#Profile
spring.application.name= ${DRP_CF_SERVICE:inventoryaggregator}_service
spring.profiles.active = ${DRP_CF_STAGE:local}

# logging
logging.config=classpath:logback-spring.xml
logging.level.org.springframework.jdbc.core.JdbcTemplate=info
logging.level.org.flywaydb=info

# applicantion environment based configuration
app.stage=${DRP_CF_STAGE:local}
app.service = ${DRP_CF_SERVICE:inventoryaggregator}

ARTICLE_CACHE_USERNAME=store_inventory
ARTICLE_CACHE_PASSWORD=${ARTICLE_CACHE_PASSWORD}
ARTICLE_CACHE_STORE_EXCEPTIONS_PATH=documents/%s/mms_store_exception?bundleno=%d&company=%s&environment=pp1&language=%s&mmsartno=%d&storeno=%d&variantno=%d
ARTICLE_CACHE_SERVICE_HOST=${EXT_ARTICLE_CACHE_SERVICE_HOST:https://articlecache.service-phalanx.metrosystems.net}
ARTICLE_CACHE_FILTER_PATH=/filter/%s/erp_ihds_tree
ARTICLE-CACHE-AAA.HOST=${EXT_ARTICLE_CACHE_SERVICE_AAA_HOST:https://articlesearch.service-phalanx.metrosystems.net}
article-cache-aaa.GENERAL=/articlekeys
article-cache-aaa.GENERALQUERYPARAM=action=search&amount=200
article-cache-aaa.FROM=&from={from}
article-cache-aaa.USERNAME=${ARTICLE_CACHE_USERNAME}
article-cache-aaa.PASSWORD=${ARTICLE_CACHE_PASSWORD}

MOVIE_STOCK_HOST=${EXT_MOVIE_STOCK_HOST:https://movie.stockservice.metrosystems.net}
MOVIE_STOCK_PATH_FOR_VARIANT=/cache?country=%s&salesLine=%s&locationId=%d&articleNo=%d&variant=%d
MOVIE_STOCK_PATH_FOR_VARIANT_BUNDLE=/cache?country=%s&salesLine=%s&locationId=%d&articleNo=%d&variant=%d&bundleNo=%d
MOVIE_PAST_OPEN_ORDER=/cache

ACL_ORDERING_HOST=${EXT_ACL_ORDERING:http://acl-ordering.apps-api-k8s-002-test9-mcc-be-gcw1.metroscales.io/api/v0}
ACL_ORDERING_PATH_FOR_VARIANT=/countryCode/%s/salesLine/%s/storeNumber/%d/ordering-views/article-ordering-data/articleNumber/%d/variantNumber/%d

ACL_STOCK_SERVICE_HOST=${EXT_ACL_STOCK_LOCATION_FOR_VARIANT_HOST:https://stock.acl.metronom.com/api/v1}
ACL_STOCK_LOCATION_PATH_FOR_VARIANT=/countries/%s/saleslines/%s/stores/%d/stock/stock-locations/articleNo/%d/variantNo/%d?page=1&page_size=1000
ACL_DAILY_MEAN_SALES_PATH_FOR_BUNDLE=/countryCode/%s/salesLine/%s/storeNumber/%d/sales-views/article-sales-data/articleNumber/%d/variantNumber/%d/packagingTypeCode/%d
ACL_STOCK_ARTICLE_LOCATION=/countries/%s/saleslines/%s/stores/%d/stock/article-locations/articleNumber/%d/variantNumber/%d/bundleNumber/%d

ACL_STORE_MASTER_DATA_HOST=${EXT_ACL_STORE_MASTER_DATA:https://storemasterdata.acl.metronom.com/api/v0}
ACL_DISCOUNTS_HOST=${EXT_ACL_DISCOUNTS_HOST:https://pricing.acl.metronom.com/api/v0}
ACL_DISCOUNTS_URI=/countries/%s/saleslines/%s/stores/%d/pricing-views/article-discount/articlenumber/%d/variantNumber/%d/bundleNumber/%d
#Query by barcode
ACL_STORE_MASTER_DATA_PATH_BY_EAN=/countryCode/%S/salesLine/%s/storeNumber/%d/store-master-data/articles?barcode=%s
#Query by subsystem article number:
ACL_STORE_MASTER_DATA_PATH_BY_SUBSYS=/countryCode/%S/salesLine/%s/storeNumber/%d/store-master-data/articles?subystemArticleNumber=%d
#Query by article number, variant number and bundle number (variant and bundle are not mandatory):
ACL_STORE_MASTER_DATA_PATH_BY_ART_VAR_BUNDLE=/countryCode/%S/salesLine/%s/storeNumber/%d/store-master-data/articles?articleNumber=%d&variantNumber=%d&bundleNumber=%d
ACL_STORE_MASTER_DATA_DEPARTMENTS_PATH=/countryCode/%s/salesLine/%s/storeNumber/%d/store-master-data/departments
ACL_STORE_MASTER_DATA_PREVIEW_WORKING_DAY_PATH=/countryCode/%s/salesLine/%s/storeNumber/%d/store-master-data/previous-working-day

multithread.executor.CorePoolSize=80
multithread.executor.MaxPoolSize=80 
multithread.executor.WaitForTasksToCompleteOnShutdown=true
multithread.executor.ThreadNamePrefix=gcaggregator
multithread.executor.QueueCapacity=40
multithread.executor.KeepAliveSeconds=0
multithread.executor.AwaitTerminationSeconds=0

app.resttemplate.send.connect.timeout=5000
app.resttemplate.send.read.timeout=20000
# IDAM
idam.url=${EXT_IDAM_URL:https://idam-pp.metrosystems.net}
idam.grant.type=client_credentials
idam.get.token=/authorize/api/oauth2/access_token
idam.realm.id=GAPCHECK
idam.client.id=GAPCHECK
idam.client.secret=${IDAM_CLIENT_CLIENT_SECRET:A5Vu7LEnls}
idam.client.scope=role=GAPCHECK_MOBILE_READ
idam.client.access-token-uri=${idam.url}/authorize/api/oauth2/access_token
idam.client.user-authorization-uri=${idam.url}/authorize/api/oauth2/authorize?realm_id=${idam.client.realm.id}
idam.client.token-name=oauth_token
idam.client.authentication-scheme=header
idam.client-authentication-scheme=form
#i need it for refresh token  idam.grant-type=authorization_code
idam.resource.user-info-uri=${idam.url}/authorize/api/oauth2/userInfo
idam.url.jwk.provider=/.well-known/openid-configuration/jwks
idam.refresh.public.key=0 0,30 * * * *
# is not used idam.gc.serviceinternal.grant.type=client_credentials
idam.TOKEN_PREFIX=Bearer
idam.AUTHORIZATION_HEADER_STRING=Authorization
idam.SIGN_UP_URL=/users/sign-up
idam.AUTHORIZATION_COOKIE_NAME=AuthorizationCookie
idam.USER_LOGIN_URL=/login/idam
idam.USER_INFO_COOKIE_NAME=UserInfoCookie
logging.level.org.apache.http=DEBUG
logging.level.org.springframework.security=debug

app.postgres.schema=${DRP_CF_SERVICE:inventoryaggregator}
springdoc.version=@springdoc.version@
springdoc.api-docs.path=/inventoryaggregator/.well-known/openapi.json
springdoc.swagger-ui.path=/inventoryaggregator/swagger-ui.html

#server.servlet.context-path=/inventoryaggregator