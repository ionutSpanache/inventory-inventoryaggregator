spring.main.banner-mode=off
server.error.whitelabel.enabled=false

#Profile
spring.application.name= ${DRP_CF_SERVICE:inventoryaggregator}_service
spring.profiles.active = ${DRP_CF_STAGE:local}

# logging
logging.config=classpath:logback-spring.xml
logging.level.org.springframework.jdbc.core.JdbcTemplate=info
logging.level.org.flywaydb=info
logging.level.org.apache.http=info
logging.level.org.springframework.security=info
logging.level.org.apache.tomcat.util.http.parser.Cookie=WARN

# applicantion environment based configuration
app.stage=${DRP_CF_STAGE:local}
app.service = ${DRP_CF_SERVICE:inventoryaggregator}
app.vertical=${DRP_CF_VERTICAL:inventory}

ARTICLE_CACHE_USERNAME=store_inventory
ARTICLE_CACHE_PASSWORD=${ARTICLE_CACHE_PASSWORD}
ARTICLE_CACHE_STORE_EXCEPTIONS_PATH=documents/%s/mms_store_exception?bundleno=%d&company=%s&environment=prod&language=%s&mmsartno=%d&storeno=%d&variantno=%d
ARTICLE_CACHE_SERVICE_HOST=${EXT_ARTICLE_CACHE_SERVICE_HOST:https://articlecache.service-phalanx.metrosystems.net}
ARTICLE_CACHE_FILTER_PATH=/filter/%s/erp_ihds_tree
ARTICLE-CACHE-AAA.HOST=${EXT_ARTICLE_CACHE_SERVICE_AAA_HOST:https://articlesearch.service-phalanx.metrosystems.net}
article-cache-aaa.GENERAL=/articlekeys
article-cache-aaa.GENERALQUERYPARAM=action=search&amount=200
article-cache-aaa.FROM=&from={from}
article-cache-aaa.USERNAME=${ARTICLE_CACHE_USERNAME}
article-cache-aaa.PASSWORD=${ARTICLE_CACHE_PASSWORD}
ARTICLE_CACHE_DOCUMENTS=documents/%s/erp_ihds_tree?bundleno=%d&company=%s&environment=%s&language=%s&mmsartno=%d&variantno=%d


MOVIE_STOCK_HOST=${EXT_MOVIE_STOCK_HOST:https://movie.stockservice.metrosystems.net}
MOVIE_STOCK_PATH_FOR_VARIANT=/cache?country=%s&salesLine=%s&locationId=%d&articleNo=%d&variant=%d
MOVIE_STOCK_PATH_FOR_VARIANT_BUNDLE=/cache?country=%s&salesLine=%s&locationId=%d&articleNo=%d&variant=%d&bundleNo=%d
MOVIE_PAST_OPEN_ORDER=/cache

MOVIE_TOTAL_AVERAGE_SALES_HOST=${EXT_MOVIE_TOTAL_AVERAGE_SALES_HOST:http://movie-prod-sales-stock-service.apps-api-k8s-001-live11-mcc-be-gcw1.metroscales.io}
MOVIE_TOTAL_AVERAGE_PATH=/salesAverage/article/total

ACL_ORDERING_HOST=${EXT_ACL_ORDERING:http://acl-ordering.apps-api-k8s-002-test9-mcc-be-gcw1.metroscales.io/api/v0}
ACL_ORDERING_PATH_FOR_VARIANT=/countryCode/%s/salesLine/%s/storeNumber/%d/ordering-views/article-ordering-data/articleNumber/%d/variantNumber/%d

ACL_PROMOTIONS_SERVICE_HOST=https://promotions.acl.metronom.com
ACL_ACTIVE_PROMOTION_PATH=/api/v0/countrycode/{countryCode}/salesline/{salesLine}/storenumber/{storeNumber}/active-promotion/promotion-id/{promotionID}/article-number/{articleNumber}/variant/{variantNumber}/selling-bundle/{sellingBundleNumber}

ACL_STOCK_SERVICE_HOST=https://stock.acl.metronom.com
ACL_STOCK_LOCATION_PATH_FOR_VARIANT=/api/v2/countries/{countryCode}/saleslines/{salesLine}/stores/{storeNumber}/stock/stock-locations/articleNo/{articleNumber}/variantNo/{variantNumber}?page=1&page_size=1000
ACL_STOCK_LOCATION_PATH_FOR_ARTICLE_LIST=/api/v1/countries/{countries}/saleslines/{salesLine}/stores/{storeNumber}/stock/stock-locations
ACL_DAILY_MEAN_SALES_PATH_FOR_BUNDLE=/countryCode/%s/salesLine/%s/storeNumber/%d/sales-views/article-sales-data/articleNumber/%d/variantNumber/%d/packagingTypeCode/%d
ACL_STOCK_ARTICLE_LOCATION=/api/v2/countries/{countryCode}/saleslines/{salesLine}/stores/{storeNumber}/stock/article-locations/articleNumber/{articleNumber}/variantNumber/{variantNumber}/bundleNumber/{bundleNumber}
ACL_STOCK_ARTICLE_LOCATION_FOR_ARTICLE_LIST=/api/v2/countries/{countries}/saleslines/{saleslines}/stores/{stores}/stock/article-locations

ACL_STORE_MASTER_DATA_HOST=${EXT_ACL_STORE_MASTER_DATA:https://storemasterdata.acl.metronom.com/api}
ACL_DISCOUNTS_HOST=${EXT_ACL_DISCOUNTS_HOST:https://pricing.acl.metronom.com/api/v0}
ACL_DISCOUNTS_URI=/countries/%s/saleslines/%s/stores/%d/pricing-views/article-discount/articlenumber/%d/variantNumber/%d/bundleNumber/%d
#Query by barcode
ACL_STORE_MASTER_DATA_PATH_BY_EAN=/v1/countryCode/{countryCode}/salesLine/{salesLine}/storeNumber/{storeNumber}/store-master-data/articles-ean?barcode={barcode}
#Query by subsystem article number:
ACL_STORE_MASTER_DATA_PATH_BY_SUBSYS=/v1/countryCode/{countryCode}/salesLine/{salesLine}/storeNumber/{storeNumber}/store-master-data/articles-subsys?subystemArticleNumber={subystemArticleNumber}
#Query by article number, variant number and bundle number (variant and bundle are not mandatory):
ACL_STORE_MASTER_DATA_PATH_ARTICLES_BY_ART_VAR_BUNDLE=/v0/countryCode/{countryCode}/salesLine/{salesLine}/storeNumber/{storeNumber}/store-master-data/articles
ACL_STORE_MASTER_DATA_DEPARTMENTS_PATH=/countryCode/%s/salesLine/%s/storeNumber/%d/store-master-data/departments
ACL_STORE_MASTER_DATA_PREVIEW_WORKING_DAY_PATH=/countryCode/%s/salesLine/%s/storeNumber/%d/store-master-data/previous-working-day
ARTICLE_DOCUMENT_ACTIVE_PROMOTION_CHANNEL=MCC

multithread.executor.CorePoolSize=400
multithread.executor.MaxPoolSize=1000
multithread.executor.WaitForTasksToCompleteOnShutdown=true
multithread.executor.ThreadNamePrefix=gcaggregator
multithread.executor.QueueCapacity=40
multithread.executor.KeepAliveSeconds=0
multithread.executor.AwaitTerminationSeconds=0

app.resttemplate.send.connect.timeout=5000
app.resttemplate.send.read.timeout=20000
# IDAM
idam.realm_id=MSTORE_RL
security.schema.openapi=IdamOauth2Security
spring.security.oauth2.client.provider.idam.token-uri=https://idam.metrosystems.net/authorize/api/oauth2/access_token

#============ Client Server security configuration ============

spring.security.oauth2.client.registration.idamacl.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.idamacl.client-id=MSTORE
spring.security.oauth2.client.registration.idamacl.client-secret=${IDAM_SECRET:r5xcDWbG08}
spring.security.oauth2.client.registration.idamacl.scope=realm_id=MMS_STORE_RL
spring.security.oauth2.client.provider.idamacl.token-uri=https://idam.metrosystems.net/authorize/api/oauth2/access_token
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://idam.metrosystems.net

app.postgres.schema=${DRP_CF_SERVICE:inventoryaggregator}
springdoc.version=@springdoc.version@
springdoc.api-docs.path=/inventoryaggregator/.well-known/openapi.json
springdoc.swagger-ui.path=/inventoryaggregator/swagger-ui.html

# metrics - datadog
metrics.host=${DRP_CF_KUBERNETES_MINION_NAME:localhost}
metrics.serviceName=${DRP_CF_SERVICE:inventoryaggregator}
metrics.vertical=${DRP_CF_VERTICAL:inventory}
metrics.stage=${DRP_CF_STAGE:local}
metrics.marcId=${DRP_EV_DD_MARC_ID:A1459}
management.statsd.metrics.export.publish-unchanged-meters=true
management.statsd.metrics.export.enabled=true
management.statsd.metrics.export.flavor=DATADOG
management.statsd.metrics.export.host=${DRP_EV_DD_AGENT_HOST:localhost}
management.statsd.metrics.export.port=${DRP_EV_DD_AGENT_PORT:8125}

#server.servlet.context-path=/inventoryaggregator
rest.template.retry.count=3
rest.template.time.to.wait.between.retry=1


