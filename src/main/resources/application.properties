spring.main.banner-mode=off
spring.web.resources.add-mappings=false


#Profile
spring.application.name= ${DRP_CF_SERVICE:inventoryaggregator}_service
spring.profiles.active = ${DRP_CF_STAGE:local}

# logging
logging.config=classpath:logback-spring.xml
logging.level.org.springframework.jdbc.core.JdbcTemplate=info
logging.level.org.flywaydb=info
logging.level.org.apache.http=info
logging.level.org.springframework.security=info
logging.level.org.apache.tomcat.util.http.parser.Cookie=WARN

# applicantion environment based configuration
app.stage=${DRP_CF_STAGE:local}
app.service = ${DRP_CF_SERVICE:inventoryaggregator}
app.vertical=${DRP_CF_VERTICAL:inventory}


ACL_STORE_MASTER_DATA_HOST=${EXT_ACL_STORE_MASTER_DATA:https://storemasterdata.acl.metronom.com/api}
#Query by article number, variant number and bundle number (variant and bundle are not mandatory):
ACL_STORE_MASTER_DATA_PATH_ARTICLES_BY_ART_VAR_BUNDLE=/v0/countryCode/{countryCode}/salesLine/{salesLine}/storeNumber/{storeNumber}/store-master-data/articles
# IDAM
idam.realm_id=MSTORE_RL
security.schema.openapi=IdamOauth2Security
spring.security.oauth2.client.provider.idam.token-uri=https://idam.metrosystems.net/authorize/api/oauth2/access_token

#============ Client Server security configuration ============

spring.security.oauth2.client.registration.idamacl.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.idamacl.client-id=MSTORE
spring.security.oauth2.client.registration.idamacl.client-secret=${IDAM_SECRET}
spring.security.oauth2.client.registration.idamacl.scope=realm_id=MMS_STORE_RL
spring.security.oauth2.client.provider.idamacl.token-uri=https://idam.metrosystems.net/authorize/api/oauth2/access_token
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://idam.metrosystems.net

spring.security.oauth2.client.registration.idam.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.idam.client-id=MSTORE
spring.security.oauth2.client.registration.idam.client-secret=${IDAM_SECRET}
spring.security.oauth2.client.registration.idam.scope=realm_id=MSTORE_RL

springdoc.version=@springdoc.version@
springdoc.api-docs.path=/inventoryaggregator/.well-known/openapi.json
springdoc.swagger-ui.path=/inventoryaggregator/swagger-ui.html

# metrics - datadog
metrics.marc.id=${DRP_EV_DD_MARC_ID:a1459}
metrics.env=${DRP_CF_STAGE:local}
metrics.solution=${DRP_EV_DD_SOLUTION:mstore}
metrics.solution.id=${DRP_EV_DD_SOLUTION_ID:s00409}
metrics.project.id=${DRP_CF_PROJECT_ID:localhost}
metrics.version=${COMMIT_SHA:local}
metrics.service=${DRP_EV_DD_SOLUTION:mstore}.${DRP_CF_VERTICAL:inventory}.${DRP_CF_SERVICE:inventoryaggregator}
metrics.host=${DRP_CF_KUBERNETES_MINION_NAME:localhost}
metrics.vertical=${DRP_CF_VERTICAL:inventory}
management.statsd.metrics.export.publish-unchanged-meters=true
management.statsd.metrics.export.enabled=true
management.statsd.metrics.export.flavor=DATADOG
management.statsd.metrics.export.host=${DRP_EV_DD_AGENT_HOST:localhost}
management.statsd.metrics.export.port=${DRP_EV_DD_AGENT_PORT:8125}

#server.servlet.context-path=/inventoryaggregator
rest.template.retry.count=3
rest.template.time.to.wait.between.retry=1



###################### MStore #####################################
mstore.inventory.host=https://inventory.metronom.com
mstore.inventory.datasource.articlelistdata.url=/datasource/api/v0/countrycode/{countryCode}/language/{languageCode}/storenumber/{storeNumber}/articles
mstore.inventory.datasource.articledata.url=/datasource/api/v0/countrycode/{countryCode}/language/{languageCode}/storenumber/{storeNumber}/articlenumber/{articleNumber}/variantnumber/{variantNumber}/bundlenumber/{bundleNumber}
mstore.inventory.datasource.articlecomponent.url=/datasource/api/v0/countrycode/{countryCode}/storenumber/{storeNumber}/articlecomponent/articlenumber/{articleNumber}
mstore.inventory.datasource.articlecomponents.url=/datasource/api/v0/countrycode/{countryCode}/storenumber/{storeNumber}/articlecomponents
mstore.generaldata.department.path=/generaldata/api/v0/countrycode/{countryCode}/salesline/{salesLine}/storenumber/{storeNumber}/generaldata/department/{departmentNumber}

mstore.inventory.mstoreacl.stockLocation.articlelist.url=/mstoreacl/api/v0/articlestocklocation/countrycode/{countryCode}/storenumber/{storeNumber}
mstore.inventory.mstoreacl.stockLocation.article.url=/mstoreacl/api/v0/articlestocklocation/countrycode/{countryCode}/storenumber/{storeNumber}/articlenumber/{articleNumber}/variantnumber/{variantNumber}/bundlenumber/{bundleNumber}

mstore.movieacl.stock.data.url=/movieacl/api/v0/countrycode/{countryCode}/salesline/{salesLine}/storenumber/{storeNumber}/stock-data
mstore.movieacl.average-sales.url=/movieacl/api/v0/countrycode/{countryCode}/salesline/{salesLine}/storenumber/{storeNumber}/average-sales/articlenumber/{articleNumber}/variant/{variantNumber}/bundle/{bundleNumber}
