multithread.executor.CorePoolSize=80
multithread.executor.MaxPoolSize=80 
multithread.executor.WaitForTasksToCompleteOnShutdown=true
multithread.executor.ThreadNamePrefix=gcaggregator
multithread.executor.QueueCapacity=40
multithread.executor.KeepAliveSeconds=0
multithread.executor.AwaitTerminationSeconds=0

app.resttemplate.send.connect.timeout=5000
app.resttemplate.send.read.timeout=20000
# IDAM
idam.url=${EXT_IDAM_URL}
idam.grant.type=client_credentials
idam.get.token=/authorize/api/oauth2/access_token
idam.realm.id=GAPCHECK
idam.client.id=GAPCHECK
idam.client.secret=${IDAM_CLIENT_CLIENT_SECRET}
idam.client.scope=role=GAPCHECK_MOBILE_READ
idam.client.access-token-uri=${idam.url}/authorize/api/oauth2/access_token
idam.client.user-authorization-uri=${idam.url}/authorize/api/oauth2/authorize?realm_id=${idam.client.realm.id}
idam.client.token-name=oauth_token
idam.client.authentication-scheme=header
idam.client-authentication-scheme=form
#i need it for refresh token  idam.grant-type=authorization_code
idam.resource.user-info-uri=${idam.url}/authorize/api/oauth2/userInfo
idam.url.jwk.provider=/.well-known/openid-configuration/jwks
idam.refresh.public.key=0 0,30 * * * *
# is not used idam.gc.serviceinternal.grant.type=client_credentials
idam.TOKEN_PREFIX=Bearer 
idam.AUTHORIZATION_HEADER_STRING=Authorization
idam.SIGN_UP_URL=/users/sign-up
idam.AUTHORIZATION_COOKIE_NAME=AuthorizationCookie
idam.USER_LOGIN_URL=/login/idam
idam.USER_INFO_COOKIE_NAME=UserInfoCookie
logging.level.org.apache.http=DEBUG
logging.level.org.springframework.security=debug
