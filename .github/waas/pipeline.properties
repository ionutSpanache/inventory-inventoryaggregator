# This file is used to setup environment variables in the WaaS workflows and
# can also be used to setup the local environment while executing the WaaS
# scripts on the local machine. It is automatically sourced by the pipeline.sh
# script.

# Full repository name used for tagging the container image with `skaffold
# build`.
# Refer to the skaffold documentation for more information about the variable:
# https://skaffold.dev/docs/references/cli/#skaffold-build

GOOGLE_GKE_IMAGE_REPOSITORY=europe-west1-docker.pkg.dev/cf-inventory-development-qq/inventory
HARBOR_IMAGE_REPOSITORY=registry.metroscales.io/inventory
# Settings for the Google Cloud Platform authentication.

COMMIT_CYCLE__GCP_SERVICE_ACCOUNT=deployment@cf-inventory-development-qq.iam.gserviceaccount.com
COMMIT_CYCLE__GCP_WORKLOAD_IDENTITY_PROVIDER=projects/882888898380/locations/global/workloadIdentityPools/github-pool/providers/github-provider

# Settings for the GCP project hosting the artifact registry.

COMMIT_CYCLE__GCP_ARTIFACT_REGISTRY=europe-west1-docker.pkg.dev
# The variables below are used to setup the kube config in the workflow,
# which must be setup to deploy the service in the environments configured in
# the workflow.
DEV__KUBERNETES_NAMESPACE=inventory-gke-dev
PP__KUBERNETES_NAMESPACE=inventory-gke-pp
PROD__KUBERNETES_NAMESPACE=inventory-prod
# Settings for the Google Cloud Platform authentication for the test environment.

DEV__GCP_SERVICE_ACCOUNT=deployment@cf-inventory-development-qq.iam.gserviceaccount.com
DEV__GCP_WORKLOAD_IDENTITY_PROVIDER=projects/882888898380/locations/global/workloadIdentityPools/github-pool/providers/github-provider
PP__GCP_SERVICE_ACCOUNT=deployment@cf-inventory-pp-h3.iam.gserviceaccount.com
PP__GCP_WORKLOAD_IDENTITY_PROVIDER=projects/137617474737/locations/global/workloadIdentityPools/github-pool/providers/github-provider
PROD__GCP_SERVICE_ACCOUNT=deployment@cf-inventory-prod-7p.iam.gserviceaccount.com
PROD__GCP_WORKLOAD_IDENTITY_PROVIDER=TBD
# Settings for the GKE cluster for the test environment.

DEV__GCP_PROJECT_ID=cf-inventory-development-qq
DEV__GKE_CLUSTER=inventory-development-qq
DEV__GKE_CLUSTER_ZONE=europe-west1
PP__GCP_PROJECT_ID=cf-inventory-pp-h3
PP__GKE_CLUSTER=inventory-pp
PP__GKE_CLUSTER_ZONE=europe-west1
PROD__GCP_PROJECT_ID=cf-inventory-prod-7p
PROD__GKE_CLUSTER=inventory-prod
PROD__GKE_CLUSTER_ZONE=europe-west1