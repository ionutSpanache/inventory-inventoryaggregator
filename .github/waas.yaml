apiVersion: waas/v1alpha4
_extends: .github
subscribe: true
stages:
  - environment: dev
    tags:
      - name: be-gcw1
    deployOn:
      - push
  - environment: pp
    tags:
      - name: be-gcw1
    deployOn:
      - push
  - environment: prod
    tags:
      - name: be-gcw1
customer: mcc
vertical: inventory
multistage: true
services:
  - id: inventoryaggregator
    type: dockerfile
    check: true
    secret: true
    probe:
      initialdelay: 210
      period: 10
    perStageConfiguration: true
    stageConfig:
      dev:
        replicas: 1
        resources:
          requests:
            memory: 280Mi
            cpu: 100m
          limits:
            memory: 812Mi
            cpu: '2'
      pp:
        replicas: 3
        resources:
          requests:
            memory: 1.1Gi
            cpu: '1'
          limits:
            memory: 2Gi
            cpu: '2'
      prod:
        replicas: 6
        resources:
          requests:
            memory: 1.2Gi
            cpu: '0.1'
          limits:
            memory: 2Gi
            cpu: '2'
tests: null
watchers:
  - alin.ciubotariu01@metrosystems.net
  - george.dumitrascu@metrosystems.net
  - cristiangabriel.jena@metrosystems.net
