name: Deploy
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release to deploy'
        required: true
      datacenter:
        description: 'Datacenter for deployment'
        required: true
        default: 'be-gcw1'
      stage:
        description: 'Environment to deploy'
        required: true
env:
  SKAFFOLD_BUILD_ARTIFACT: skaffold_build_artifact.json
  SOPS_VERSION: 3.6.1
  release: ${{ github.event.inputs.release }}
  stage: ${{ github.event.inputs.stage }}
  datacenter: ${{ github.event.inputs.datacenter }}
jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v2
      with:
        ref: ${{ env.release }}
    - name: Setup tools
      uses: metro-digital/setup-tools-for-waas@v0.x
      with:
        version: 'waas/v1alpha4'
    - name: Decrypt common secrets of all environments
      uses: metro-digital-inner-source/sops-decrypt@v0.2.0
      with:
        version: ${{ env.SOPS_VERSION }}
        file: 'waas-config/base/application.secrets.yaml'
        gpg_key: ${{ secrets.GPG_KEY }}
        output_type: json
    - name: Get access token for deployment technical user
      id: deployment_technical_user
      run: |
        access_token=$(curl -sSL -X POST -k \
                      -H 'Content-Type:application/x-www-form-urlencoded' \
                      -u "${{ secrets.PRODUCT_INVENTORY_TU_ID }}:${{ secrets.PRODUCT_INVENTORY_TU_SECRET }}" \
                      -d "grant_type=client_credentials&realm_id=PENG_2TR_RLM&scope=clnt%3Dpcui&client_id=${{ secrets.PRODUCT_INVENTORY_TU_ID }}" \
                      https://idam.metrosystems.net/authorize/api/oauth2/access_token \
                      | jq -rc .access_token)
        echo "::add-mask::$access_token"
        echo "::set-output name=token::$access_token"
    - name: Get k8s URL key name
      id: k8s
      run: |
        stage=$(echo "${{ env.stage }}" | tr '[:lower:]' '[:upper:]')
        stage_with_dc=$(echo "${stage}_${{ env.datacenter }}" | tr '[:lower:]' '[:upper:]' | sed 's/-/_/g')
        key_name="K8S_${stage}_CLUSTER_URL"
        key_name_with_dc="K8S_${stage_with_dc}_CLUSTER_URL"
        echo "::set-output name=key_name::$key_name"
        echo "::set-output name=key_name_with_dc::$key_name_with_dc"
    - name: Setup kubectl config for ${{ env.stage }}
      run: |
        environment="inventory-${{ env.stage }}"
        k8s_api=`[ ! -z "${{ secrets[steps.k8s.outputs.key_name_with_dc] }}" ] && echo ${{ secrets[steps.k8s.outputs.key_name_with_dc] }} || echo ${{ secrets[steps.k8s.outputs.key_name] }}`
        kubectl config set-cluster ${environment} --server=${k8s_api} --insecure-skip-tls-verify
        kubectl config set-credentials ${environment}-user \
        --auth-provider=oidc \
        --auth-provider-arg=idp-issuer-url=https://idam.metrosystems.net \
        --auth-provider-arg=client-id=${{ secrets.PRODUCT_INVENTORY_TU_ID }} \
        --auth-provider-arg=id-token=${{ steps.deployment_technical_user.outputs.token }}
        kubectl config set-context ${environment} --cluster=${environment} --namespace=${environment} --user=${environment}-user
        kubectl config use-context ${environment}
    - name: Produce skaffold build artifact
      run: |
        tag=${{ env.release }}
        skaffold build --default-repo=registry.metroscales.io/inventory --tag=$tag -q --dry-run > ${{ env.SKAFFOLD_BUILD_ARTIFACT }}
    - name: Check if k8s deployment requires migration
      id: migration
      run: |
        deploymentExists=$(kubectl get deployments | (grep 'inventory-inventoryaggregator' || true))
        if [ -n "$deploymentExists" ]; then
          provider=$(kubectl get deployment inventory-inventoryaggregator -o jsonpath='{.metadata.labels.provider}')
          if [ "$provider" == "deployment-controller" ]; then
            echo "::set-output name=needed::true"
          fi
        fi
    - name: Migrate deployment definition if required
      if: steps.migration.outputs.needed == 'true'
      run: |
        SKAFFOLD_UPDATE_CHECK=false \
        skaffold render -a ${{ env.SKAFFOLD_BUILD_ARTIFACT }} -p ${{ env.stage }}-${{ env.datacenter }} \
          | yq -j -d'*' r  - \
          | jq 'select(.kind == "Deployment")' \
          | kubectl replace --save-config -f -
    - name: Get repository information
      uses: octokit/request-action@v2.x
      id: repo_information
      with:
        route: GET /repos/{owner}/{repo}
        owner: octokit
        repo: request-action
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Deploy to ${{ env.stage }}
      run: |
        tag=${{ env.release }}
        stage="${{ env.stage }}"
        LABELS="provider=waas,repository.name=${{ github.event.repository.name }},repository.id=${{ fromJson(steps.repo_information.outputs.data).id }},repository.commit_sha=${GITHUB_SHA},tags.datadoghq.com/env=${stage},tags.datadoghq.com/version=${tag}"
        SKAFFOLD_UPDATE_CHECK=false \
        skaffold deploy -a ${{ env.SKAFFOLD_BUILD_ARTIFACT }} -p ${{ env.stage }}-${{ env.datacenter }} -l "$LABELS"
  notification:
    needs: [deploy]
    runs-on: self-hosted
    if: always()
    steps:
    - name: Set workflow conclusion
      uses: technote-space/workflow-conclusion-action@v1
    - run: |
        echo ${{ env.WORKFLOW_CONCLUSION }}
    - name: Send notification email on workflow failure
      if: contains( env.WORKFLOW_CONCLUSION, 'failure' )
      uses: wadeww/send-email-action@master
      with:
        server_address: viruswall.mgi.de
        port: 25
        subject: GitHub WaaS workflow run failed
        body: |
          WaaS workflow failed for ${{ github.repository }}:
          Commit message: ${{ github.event.head_commit.message }}
          Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: 'alin.ciubotariu01@metrosystems.net, george.dumitrascu@metrosystems.net, cristiangabriel.jena@metrosystems.net'
        from: do-not-reply@metrosystems.net
