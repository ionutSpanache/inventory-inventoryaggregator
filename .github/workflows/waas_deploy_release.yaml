# waas-version: b0fbb0b - 2021-08-05 - 1628149395
name: Deploy
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release to deploy'
        required: true
      datacenter:
        description: 'Datacenter for deployment'
        required: true
        default: 'be-gcw1'
      stage:
        description: 'Environment to deploy'
        required: true
env:
  SOPS_VERSION: 3.6.1
  ARTIFACTORY_PASSWORD_REF: ${{ secrets.ARTIFACTORY_PASSWORD }}
  ARTIFACTORY_USERNAME_REF: ${{ secrets.ARTIFACTORY_USERNAME }}
  release: ${{ github.event.inputs.release }}
  stage: ${{ github.event.inputs.stage }}
  datacenter: ${{ github.event.inputs.datacenter }}
jobs:
  deploy:
    runs-on: [self-hosted, Linux, metro-network]
    steps:
    - name: Trim inputs
      run: |
        echo "release=$(echo "${{ env.release }}" | tr -d '[:space:]')" >> $GITHUB_ENV
        echo "datacenter=$(echo "${{ env.datacenter }}" | tr -d '[:space:]')" >> $GITHUB_ENV
        echo "stage=$(echo "${{ env.stage }}" | tr -d '[:space:]')" >> $GITHUB_ENV
    - uses: actions/checkout@v2
      with:
        ref: ${{ env.release }}
        fetch-depth: 1
    - name: Setup tools used by WaaS
      uses: metro-digital/setup-tools-for-waas@v0.x
      with:
        version: 'waas/v1alpha4'
    - name: Import GPG key (used by skaffold deploy)
      id: import_gpg_kex
      uses: crazy-max/ghaction-import-gpg@v3
      with:
        gpg-private-key: ${{ secrets.GPG_KEY }}
    - name: Get secret name for K8S API URL
      id: k8s
      run: |
        stage=$(echo "${{ env.stage }}" | tr '[:lower:]' '[:upper:]')
        stage_with_dc=$(echo "${stage}_${{ env.datacenter }}" | tr '[:lower:]' '[:upper:]' | sed 's/-/_/g')
        key_name="K8S_${stage}_CLUSTER_URL"
        key_name_with_dc="K8S_${stage_with_dc}_CLUSTER_URL"
        echo "::set-output name=key_name::$key_name"
        echo "::set-output name=key_name_with_dc::$key_name_with_dc"
    - name: Setup kubectl config for ${{ env.stage }}
      uses: metro-digital/oidc-set-context@v0.x
      with:
        oidc_url: ${{ secrets.IDAM_OIDC_URL }}
        oidc_username: ${{ secrets.PRODUCT_INVENTORY_TU_ID }}
        oidc_password: ${{ secrets.PRODUCT_INVENTORY_TU_SECRET }}
        k8s_url: ${{ secrets[steps.k8s.outputs.key_name_with_dc] || secrets[steps.k8s.outputs.key_name] }}
        k8s_namespace: 'inventory-${{ env.stage }}'
        k8s_skip_tls_verify: true
    - name: Get repository information (to put in K8S deployment)
      uses: octokit/request-action@v2.x
      id: repo_information
      with:
        route: GET /repos/${{ github.repository }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create GitHub deployment
      uses: octokit/request-action@v2.x
      id: create_deployment
      with:
        route: POST /repos/${{ github.repository }}/deployments
        mediaType: '{"previews": ["ant-man","flash"]}'
        ref: ${{ env.release }}
        environment: ${{ env.stage }}-${{ env.datacenter }}
        auto_merge: false
        required_contexts: '[]'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Deploy to ${{ env.stage }}
      id: do_deployment
      continue-on-error: true
      run: |
        tag=${{ env.release }}
        stage="${{ env.stage }}"
        LABELS="provider=waas,repository.name=${{ github.event.repository.name }},repository.id=${{ fromJson(steps.repo_information.outputs.data).id }},repository.commit_sha=${GITHUB_SHA},tags.datadoghq.com/env=${stage},tags.datadoghq.com/version=${tag}"
        SKAFFOLD_UPDATE_CHECK=false \
        skaffold deploy -a <(skaffold --default-repo=registry.metroscales.io/inventory build -q --dry-run) -p ${{ env.stage }}-${{ env.datacenter }} -l "$LABELS"
    - name: Create deployment status success
      if: steps.do_deployment.outcome == 'success'
      uses: octokit/request-action@v2.x
      with:
        route: POST /repos/${{ github.repository }}/deployments/{deployment_id}/statuses
        mediaType: '{"previews": ["ant-man","flash"]}'
        deployment_id: ${{ fromJson(steps.create_deployment.outputs.data).id }}
        state: success
        auto_inactive: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create deployment status failure
      if: steps.do_deployment.outcome == 'failure'
      uses: octokit/request-action@v2.x
      with:
        route: POST /repos/${{ github.repository }}/deployments/{deployment_id}/statuses
        mediaType: '{"previews": ["ant-man","flash"]}'
        deployment_id: ${{ fromJson(steps.create_deployment.outputs.data).id }}
        state: failure
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Check for errors during deployment into K8S
      if: steps.do_deployment.outcome == 'failure'
      uses: actions/github-script@v4
      with:
        script: |
          core.setFailed('WaaS: deploy: skaffold deploy failed')
  notification:
    needs: [deploy]
    runs-on: [self-hosted, Linux, metro-network]
    if: always()
    steps:
    - name: Set workflow conclusion
      uses: technote-space/workflow-conclusion-action@v2
    - run: |
        echo ${{ env.WORKFLOW_CONCLUSION }}
    - name: Send notification email on workflow failure
      if: always() && contains( env.WORKFLOW_CONCLUSION, 'failure' )
      uses: wadeww/send-email-action@master
      with:
        server_address: viruswall.mgi.de
        port: 25
        subject: GitHub WaaS workflow run failed
        body: |
          WaaS workflow failed for ${{ github.repository }}:
          Commit message: ${{ github.event.head_commit.message }}
          Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: 'alin.ciubotariu01@metrosystems.net, george.dumitrascu@metrosystems.net, cristiangabriel.jena@metrosystems.net'
        from: do-not-reply@metrosystems.net
