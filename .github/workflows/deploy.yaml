name: 'Deploy GKE'
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Provide GitHub tag to be deployed"
        type: string
        required: true
concurrency:
  group: 'WaaS: Deployment pipeline'
  cancel-in-progress: false
jobs:
  trigger-deployment-pipeline:
    uses: metro-digital-inner-source/inventory-configuration/.github/workflows/deploy.yaml@master
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
