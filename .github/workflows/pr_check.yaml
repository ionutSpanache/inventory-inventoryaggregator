name: PR Check

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build-sonar-testing:
    uses: metro-digital-inner-source/inventory-configuration/.github/workflows/PR_Check_reusable_java17.yaml@master
    with:
      sonar_projectKey: inventory-inventoryaggregator
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}