name: Build & Release
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
    paths-ignore:
      - ".github/waas.yaml"
      - ".github/secret-management.yaml"
env:
  SKAFFOLD_BUILD_ARTIFACT: skaffold_build_artifact.json
  SOPS_VERSION: 3.6.1
  _GKE_LOCATION: europe-west1
  _GKE_DEV_CLUSTER: inventory-development-qq
  _GKE_DEV_PROJECT: cf-inventory-development-qq
  _GKE_PP_CLUSTER: inventory-pp
  _GKE_PP_PROJECT: cf-inventory-pp-h3
jobs:
  build:
    runs-on: [self-hosted, Linux, metro-network]
    steps:
    - uses: actions/checkout@v2
      with:
        ref: master
    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'
    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.3
      with:
        maven-version: 3.8.2
    - name: Check structure updates
      uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          src:
            - 'src/**'
          pom:
            - 'pom.xml'
    # run only if files under src or pom.xml were changed
    - name: Cache SonarQube packages
      if: steps.filter.outputs.src == 'true' || steps.filter.outputs.pom == 'true'
      uses: actions/cache@v1
      with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
    - name: Cache Maven packages
      uses: actions/cache@v1
      with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
    # run only if files under src or pom.xml were changed
    - name: Build and analyze
      if: steps.filter.outputs.src == 'true' || steps.filter.outputs.pom == 'true'
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=inventory-inventoryaggregator
    # run only if files under src and pom.xml were not changed
    - name: Build with Maven without analyze
      if: steps.filter.outputs.src == 'false' && steps.filter.outputs.pom == 'false'
      run: mvn --batch-mode --update-snapshots verify
    - name: Setup tools
      uses: metro-digital/setup-tools-for-waas@v0.x
      with:
        version: 'waas/v1alpha4'
    - name: Decrypt common secrets of all environments
      id: common_secrets
      uses: metro-digital/sops-decrypt@v0.x
      with:
        version: ${{ env.SOPS_VERSION }}
        file: 'waas-config/base/application.secrets.yaml'
        gpg_key: ${{ secrets.GPG_KEY }}
        output_type: json
    - name: Login to container registry
      run: |
        username=$(echo $connection_string | cut -d: -f2 | cut -d/ -f3)
        password=$(echo $connection_string | cut -d@ -f1 | cut -d: -f3)
        hostname=$(echo $connection_string | cut -d@ -f2 | cut -d/ -f1)
        echo -n "$password" | docker login "$hostname" -u "$username" --password-stdin
      env:
        connection_string: ${{ fromJson(steps.common_secrets.outputs.data).DRP_PF_DOCKER_1 }}
    - name: Check if docker image exist in container registry
      id: check_for_existing_docker_image
      run: |
        set +e
        set -o pipefail
        image=$(skaffold --default-repo=registry.metroscales.io/inventory build -q --dry-run | jq -r ".builds[0].tag")
        echo "::set-output name=image_tag::$image"
        if [ $? -ne 0 ]; then
          echo "::error ::WaaS: build: check for docker image: skaffold build failed"
          exit 15
        fi
        imageExist=$(docker manifest inspect $image > /dev/null && echo "true" || echo "false")
        echo "::set-output name=needed::$imageExist"
    - name: Build & push image to container registry (if needed)
      id: build_and_push_docker_image
      if: steps.check_for_existing_docker_image.outputs.needed == 'false'
      run: |
        set +e
        set -o pipefail
        skaffold --default-repo=registry.metroscales.io/inventory build -p push
        if [ $? -ne 0 ]; then
          echo "::error ::WaaS: build: skaffold build and push failed"
          exit 20
        fi
    deploy-gke-dev:
    needs: [build]
    environment: gke-dev
    runs-on: [self-hosted, Linux, metro-network]
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 1
    - id: 'auth'
      uses: 'google-github-actions/auth@v0'
      with:
        credentials_json: '${{ secrets.GKE_DEPLOYMENT_SA_DEV }}'
    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v0'
    - name: 'Use gcloud CLI'
      run: 'gcloud info'
    - name: Setup tools used by WaaS
      uses: metro-digital/setup-tools-for-waas@v0.x
      with:
        version: 'waas/v1alpha4'
    - name: Import GPG key (used by skaffold deploy)
      id: import_gpg_kex
      uses: crazy-max/ghaction-import-gpg@v3
      with:
        gpg-private-key: ${{ secrets.GPG_KEY }}
    - name: Update master authorized networks
      run: |
        apt install dnsutils -y
        dig +short myip.opendns.com @resolver1.opendns.com > _EXT-IP
        gcloud container clusters describe $_GKE_DEV_CLUSTER --project=$_GKE_DEV_PROJECT --zone=europe-west1 | grep cidrBlock: | awk '{gsub("  - cidrBlock: ", "");print}' | tee master-auth-ranges master-auth-ranges-new && echo $(cat _EXT-IP)/32 >> master-auth-ranges-new && tr '\n' ',' < master-auth-ranges-new > master-auth-test && truncate -s -1 master-auth-test && CIDRS=$(cat master-auth-test)
        gcloud container clusters update $_GKE_DEV_CLUSTER --project=$_GKE_DEV_PROJECT --region=$_GKE_LOCATION \
        --enable-master-authorized-networks \
        --master-authorized-networks $CIDRS
    - uses: azure/setup-kubectl@v3
      id: install
    - name: Setup context
      run: gcloud container clusters get-credentials $_GKE_DEV_CLUSTER --region europe-west1 --project $_GKE_DEV_PROJECT
    - name: Get repository information (to put in K8S deployment)
      uses: octokit/request-action@v2.x
      id: repo_information
      with:
        route: GET /repos/${{ github.repository }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Deploy to gke-dev
      run: |
        set +e
        set -o pipefail
        tag=$(echo $GITHUB_SHA | cut -c1-7)
        LABELS="provider=waas,repository.name=${{ github.event.repository.name }},repository.id=${{ fromJson(steps.repo_information.outputs.data).id }},repository.commit_sha=${GITHUB_SHA},tags.datadoghq.com/env=dev,tags.datadoghq.com/version=${tag}"
        SKAFFOLD_UPDATE_CHECK=false \
        skaffold deploy -a <(skaffold --default-repo=registry.metroscales.io/inventory build -q --dry-run) -p dev-be-gcw1 -l "$LABELS"
        if [ $? -ne 0 ]; then
          echo "::error ::WaaS: deploy: skaffold deploy failed"
          exit 40
        fi
    - name: Revert master authorized networks
      id: revert_master_auth
      run: |
        tr '\n' ',' < master-auth-ranges > master-auth-old && truncate -s -1 master-auth-old && CIDRS_OLD=$(cat master-auth-old)
        gcloud container clusters update $_GKE_DEV_CLUSTER --project=$_GKE_DEV_PROJECT --region=$_GKE_LOCATION \
        --enable-master-authorized-networks \
        --master-authorized-networks $CIDRS_OLD
  deploy-gke-pp:
    needs: [deploy-gke-dev]
    environment: pp-be-gcw1
    runs-on: [self-hosted, Linux, metro-network]
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 1
    - id: 'auth'
      uses: 'google-github-actions/auth@v0'
      with:
        credentials_json: '${{ secrets.GKE_DEPLOYMENT_SA_PP }}'
    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v0'
    - name: 'Use gcloud CLI'
      run: 'gcloud info'
    - name: Setup tools used by WaaS
      uses: metro-digital/setup-tools-for-waas@v0.x
      with:
        version: 'waas/v1alpha4'
    - name: Import GPG key (used by skaffold deploy)
      id: import_gpg_kex
      uses: crazy-max/ghaction-import-gpg@v3
      with:
        gpg-private-key: ${{ secrets.GPG_KEY }}
    - name: Update master authorized networks
      run: |
        apt install dnsutils -y
        dig +short myip.opendns.com @resolver1.opendns.com > _EXT-IP
        gcloud container clusters describe $_GKE_PP_CLUSTER --project=$_GKE_PP_PROJECT --zone=europe-west1 | grep cidrBlock: | awk '{gsub("  - cidrBlock: ", "");print}' | tee master-auth-ranges master-auth-ranges-new && echo $(cat _EXT-IP)/32 >> master-auth-ranges-new && tr '\n' ',' < master-auth-ranges-new > master-auth-test && truncate -s -1 master-auth-test && CIDRS=$(cat master-auth-test)
        gcloud container clusters update $_GKE_PP_CLUSTER --project=$_GKE_PP_PROJECT --region=$_GKE_LOCATION \
        --enable-master-authorized-networks \
        --master-authorized-networks $CIDRS
    - uses: azure/setup-kubectl@v3
      id: install
    - name: Setup context
      run: gcloud container clusters get-credentials $_GKE_PP_CLUSTER --region europe-west1 --project $_GKE_PP_PROJECT
    - name: Get repository information (to put in K8S deployment)
      uses: octokit/request-action@v2.x
      id: repo_information
      with:
        route: GET /repos/${{ github.repository }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Deploy to gke-pp
      run: |
        set +e
        set -o pipefail
        tag=$(echo $GITHUB_SHA | cut -c1-7)
        LABELS="provider=waas,repository.name=${{ github.event.repository.name }},repository.id=${{ fromJson(steps.repo_information.outputs.data).id }},repository.commit_sha=${GITHUB_SHA},tags.datadoghq.com/env=pp,tags.datadoghq.com/version=${tag}"
        SKAFFOLD_UPDATE_CHECK=false \
        skaffold deploy -a <(skaffold --default-repo=registry.metroscales.io/inventory build -q --dry-run) -p pp-be-gcw1 -l "$LABELS"
        if [ $? -ne 0 ]; then
          echo "::error ::WaaS: deploy: skaffold deploy failed"
          exit 40
        fi
    - name: Revert master authorized networks
      id: revert_master_auth
      run: |
        tr '\n' ',' < master-auth-ranges > master-auth-old && truncate -s -1 master-auth-old && CIDRS_OLD=$(cat master-auth-old)
        gcloud container clusters update $_GKE_PP_CLUSTER --project=$_GKE_PP_PROJECT --region=$_GKE_LOCATION \
        --enable-master-authorized-networks \
        --master-authorized-networks $CIDRS_OLD
  release:
    needs: [deploy-gke-pp]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Generate default tag
      run: |
        tag="build-`date +"%Y%m%d"`-${{ github.run_number }}"
        echo "TAG=$tag" >> $GITHUB_ENV
    - name: Set git tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
    - name: Set changelog subject
      id: changelog
      run: echo ::set-output name=subject::$(git log -1 --format="%s")
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.TAG }}
        tag: ${{ env.TAG }}
        body: |
          **Changes**
          - ${{ steps.changelog.outputs.subject }}
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
  notification:
    needs: [release]
    runs-on: [self-hosted, Linux, metro-network]
    if: always()
    steps:
    - name: Set workflow conclusion
      uses: technote-space/workflow-conclusion-action@v2
    - run: |
        echo ${{ env.WORKFLOW_CONCLUSION }}
    - name: Send notification email on workflow failure
      if: always() && contains( env.WORKFLOW_CONCLUSION, 'failure' )
      uses: wadeww/send-email-action@master
      with:
        server_address: viruswall.mgi.de
        port: 25
        subject: GitHub WaaS workflow run failed
        body: |
          WaaS workflow failed for ${{ github.repository }}:
          Commit message: ${{ github.event.head_commit.message }}
          Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: 'andrei.meran@metro-external.digital, cosmin.drula@metro.digital'
        from: do-not-reply@metrosystems.net
