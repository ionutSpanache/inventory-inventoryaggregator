# waas-version: b0fbb0b - 2021-08-05 - 1628149395
name: Build & Release
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
    paths-ignore:
      - ".github/waas.yaml"
      - ".github/secret-management.yaml"
env:
  SOPS_VERSION: 3.6.1
  ARTIFACTORY_PASSWORD_REF: ${{ secrets.ARTIFACTORY_PASSWORD }}
  ARTIFACTORY_USERNAME_REF: ${{ secrets.ARTIFACTORY_USERNAME }}
jobs:
  build:
    runs-on: [self-hosted, Linux, metro-network]
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        ref: master
    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'
    - name: Add execution permissions
      run: chmod +x mvnw
    - name: Build with Maven
      run: ./mvnw --gs mvn-settings.xml --batch-mode --update-snapshots verify
    - name: Setup tools used by WaaS
      uses: metro-digital/setup-tools-for-waas@v0.x
      with:
        version: 'waas/v1alpha4'
    - name: Decrypt secrets to get docker login credentials
      id: decrypt_docker_secrets
      uses: metro-digital/sops-decrypt@v0.x
      with:
        version: ${{ env.SOPS_VERSION }}
        file: 'waas-config/base/application.secrets.yaml'
        gpg_key: ${{ secrets.GPG_KEY }}
        output_type: json
    - name: Login to container registry
      run: |
        set +e
        set -o pipefail
        username=$(echo $connection_string | cut -d: -f2 | cut -d/ -f3)
        password=$(echo $connection_string | cut -d@ -f1 | cut -d: -f3)
        hostname=$(echo $connection_string | cut -d@ -f2 | cut -d/ -f1)
        echo "Login to docker registry $hostname"
        echo -n "$password" | docker login "$hostname" -u "$username" --password-stdin
        if [ $? -ne 0 ]; then
          echo "::error ::WaaS: build: login to docker registry failed"
          exit 10
        fi
      env:
        connection_string: ${{ fromJson(steps.decrypt_docker_secrets.outputs.data).DRP_PF_DOCKER_1 }}
    - name: Check if docker image exist in container registry
      id: check_for_existing_docker_image
      run: |
        set +e
        set -o pipefail
        image=$(skaffold --default-repo=registry.metroscales.io/inventory build -q --dry-run | jq -r ".builds[0].tag")
        if [ $? -ne 0 ]; then
          echo "::error ::WaaS: build: check for docker image: skaffold build failed"
          exit 15
        fi
        imageExist=$(docker manifest inspect $image > /dev/null && echo "true" || echo "false")
        echo "::set-output name=needed::$imageExist"
    - name: Build & push image to container registry (if needed)
      id: build_and_push_docker_image
      if: steps.check_for_existing_docker_image.outputs.needed == 'false'
      run: |
        set +e
        set -o pipefail
        skaffold --default-repo=registry.metroscales.io/inventory build -p push
        if [ $? -ne 0 ]; then
          echo "::error ::WaaS: build: skaffold build and push failed"
          exit 20
        fi
  deploy-dev-be-gcw1:
    needs: [build]
    environment: dev-be-gcw1
    runs-on: [self-hosted, Linux, metro-network]
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 1
    - name: Setup tools used by WaaS
      uses: metro-digital/setup-tools-for-waas@v0.x
      with:
        version: 'waas/v1alpha4'
    - name: Import GPG key (used by skaffold deploy)
      id: import_gpg_kex
      uses: crazy-max/ghaction-import-gpg@v3
      with:
        gpg-private-key: ${{ secrets.GPG_KEY }}
    - name: Setup kubectl config for dev-be-gcw1
      uses: metro-digital/oidc-set-context@v0.x
      with:
        oidc_url: ${{ secrets.IDAM_OIDC_URL }}
        oidc_username: ${{ secrets.PRODUCT_INVENTORY_TU_ID }}
        oidc_password: ${{ secrets.PRODUCT_INVENTORY_TU_SECRET }}
        k8s_url: ${{ secrets.K8S_DEV_BE_GCW1_CLUSTER_URL || secrets.K8S_DEV_CLUSTER_URL }}
        k8s_namespace: 'inventory-dev'
        k8s_skip_tls_verify: true
    - name: Get repository information (to put in K8S deployment)
      uses: octokit/request-action@v2.x
      id: repo_information
      with:
        route: GET /repos/${{ github.repository }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Deploy to dev-be-gcw1
      run: |
        set +e
        set -o pipefail
        tag=$(echo $GITHUB_SHA | cut -c1-7)
        LABELS="provider=waas,repository.name=${{ github.event.repository.name }},repository.id=${{ fromJson(steps.repo_information.outputs.data).id }},repository.commit_sha=${GITHUB_SHA},tags.datadoghq.com/env=dev,tags.datadoghq.com/version=${tag}"
        SKAFFOLD_UPDATE_CHECK=false \
        skaffold deploy -a <(skaffold --default-repo=registry.metroscales.io/inventory build -q --dry-run) -p dev-be-gcw1 -l "$LABELS"
        if [ $? -ne 0 ]; then
          echo "::error ::WaaS: deploy: skaffold deploy failed"
          exit 40
        fi
  deploy-pp-be-gcw1:
    needs: [deploy-dev-be-gcw1]
    environment: pp-be-gcw1
    runs-on: [self-hosted, Linux, metro-network]
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 1
    - name: Setup tools used by WaaS
      uses: metro-digital/setup-tools-for-waas@v0.x
      with:
        version: 'waas/v1alpha4'
    - name: Import GPG key (used by skaffold deploy)
      id: import_gpg_kex
      uses: crazy-max/ghaction-import-gpg@v3
      with:
        gpg-private-key: ${{ secrets.GPG_KEY }}
    - name: Setup kubectl config for pp-be-gcw1
      uses: metro-digital/oidc-set-context@v0.x
      with:
        oidc_url: ${{ secrets.IDAM_OIDC_URL }}
        oidc_username: ${{ secrets.PRODUCT_INVENTORY_TU_ID }}
        oidc_password: ${{ secrets.PRODUCT_INVENTORY_TU_SECRET }}
        k8s_url: ${{ secrets.K8S_PP_BE_GCW1_CLUSTER_URL || secrets.K8S_PP_CLUSTER_URL }}
        k8s_namespace: 'inventory-pp'
        k8s_skip_tls_verify: true
    - name: Get repository information (to put in K8S deployment)
      uses: octokit/request-action@v2.x
      id: repo_information
      with:
        route: GET /repos/${{ github.repository }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Deploy to pp-be-gcw1
      run: |
        set +e
        set -o pipefail
        tag=$(echo $GITHUB_SHA | cut -c1-7)
        LABELS="provider=waas,repository.name=${{ github.event.repository.name }},repository.id=${{ fromJson(steps.repo_information.outputs.data).id }},repository.commit_sha=${GITHUB_SHA},tags.datadoghq.com/env=pp,tags.datadoghq.com/version=${tag}"
        SKAFFOLD_UPDATE_CHECK=false \
        skaffold deploy -a <(skaffold --default-repo=registry.metroscales.io/inventory build -q --dry-run) -p pp-be-gcw1 -l "$LABELS"
        if [ $? -ne 0 ]; then
          echo "::error ::WaaS: deploy: skaffold deploy failed"
          exit 40
        fi
  release:
    needs: [deploy-pp-be-gcw1]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Generate default release tag
      run: |
        tag="build-`date +"%Y%m%d"`-${{ github.run_number }}"
        echo "TAG=$tag" >> $GITHUB_ENV
    - name: Override default release tag (if a git tag is set)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
    - name: Set changelog subject
      id: changelog
      run: echo ::set-output name=subject::$(git log -1 --format="%s")
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.TAG }}
        tag: ${{ env.TAG }}
        body: |
          **Changes**
          - ${{ steps.changelog.outputs.subject }}
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
  notification:
    needs: [release]
    runs-on: [self-hosted, Linux, metro-network]
    if: always()
    steps:
    - name: Set workflow conclusion
      uses: technote-space/workflow-conclusion-action@v2
    - run: |
        echo ${{ env.WORKFLOW_CONCLUSION }}
    - name: Send notification email on workflow failure
      if: always() && contains( env.WORKFLOW_CONCLUSION, 'failure' )
      uses: wadeww/send-email-action@master
      with:
        server_address: viruswall.mgi.de
        port: 25
        subject: GitHub WaaS workflow run failed
        body: |
          WaaS workflow failed for ${{ github.repository }}:
          Commit message: ${{ github.event.head_commit.message }}
          Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: 'alin.ciubotariu01@metrosystems.net, george.dumitrascu@metrosystems.net, cristiangabriel.jena@metrosystems.net'
        from: do-not-reply@metrosystems.net
