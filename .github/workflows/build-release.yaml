name: 'Build and Release'
on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/waas.yaml
      - .github/secret-management.yaml
      - .github/workflows/deploy.yaml
concurrency:
  group: 'WaaS: Deployment pipeline'
  cancel-in-progress: false
jobs:
  checkout-workflows-testing:
    runs-on: ubuntu-latest
    steps:
    - name: Check out inventory-configuration
      uses: actions/checkout@master
      with:
        repository: metro-digital-inner-source/inventory-configuration
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    - uses: actions/upload-artifact@v3
      with:
        name: workflows-configuration
        path: .github/workflows/
  trigger-deployment-pipeline:
    needs:
    - checkout-workflows-testing
    uses: metro-digital-inner-source/inventory-configuration/.github/workflows/deployment-pipeline.yaml@master
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      TECH_PASSWORD: ${{ secrets.TECH_PASSWORD }}
      IDAM_SECRET_PASSWORD: ${{ secrets.IDAM_SECRET_PASSWORD }}
      GPG_KEY: ${{ secrets.GPG_KEY }}
      TEST_SERVICE: ${{ secrets.TEST_SERVICE }}