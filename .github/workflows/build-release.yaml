name: 'Build and Release'
on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/waas.yaml
      - .github/workflows/deploy.yaml
      - .github/workflows/polaris.yaml
concurrency:
  group: 'WaaS: Deployment pipeline'
  cancel-in-progress: false
jobs:
  trigger-deployment-pipeline:
    uses: metro-digital-inner-source/inventory-configuration/.github/workflows/deployment-pipeline-without-tests-with-args.yaml@master
    with:
      java_version: '25'
    secrets: inherit
