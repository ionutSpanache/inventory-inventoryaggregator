name: 'Build and Release'
on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/waas.yaml
      - .github/secret-management.yaml
      - .github/workflows/deploy.yaml
concurrency:
  group: 'WaaS: Deployment pipeline'
  cancel-in-progress: false
jobs:
  trigger-deployment-pipeline:
    uses: metro-digital-inner-source/inventory-configuration/.github/workflows/deployment-pipeline-without-tests.yaml@dev-temp
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      GPG_KEY: ${{ secrets.GPG_KEY }}