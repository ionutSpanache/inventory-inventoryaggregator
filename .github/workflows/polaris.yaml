name: Polaris Vulnerability Scan
on:
  push:
    ### run scans on each push to branches
    branches: [ main, master ]  
  schedule: 
    ### run scheduled scans to ensure repositories are scaned even if not actively developed
    - cron: '55 16 * * *'
  workflow_dispatch:
    ### allow manual trigger if needed
jobs:
  build:
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Polaris Scan
        uses: synopsys-sig/synopsys-action@v1.11.0
        with:
          ### SCANNING: Required fields
          polaris_server_url: ${{ secrets.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SCA,SAST"
          ### SCANNING
          polaris_application_name: M.STORE
          polaris_project_name: ${{ github.event.repository.name }}