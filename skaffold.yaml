apiVersion: skaffold/v2beta12
kind: Config
metadata:
  name: inventoryaggregator
build:
  artifacts:
  - image: inventoryaggregator
    docker:
      dockerfile: Dockerfile
  tagPolicy:
    gitCommit:
      variant: AbbrevCommitSha
      ignoreChanges: true
  local:
    push: false
deploy:
  kustomize: {}
  statusCheckDeadlineSeconds: 360
profiles:
  - name: push
    build:
      local:
        push: true
    activation:
      - command: push
  - name: dev-be-gcw1
    deploy:
      kustomize:
        buildArgs:
        - --enable_alpha_plugins
        paths:
        - waas-config/environments/be-gcw1/dev
    activation:
      - command: dev-be-gcw1
  - name: pp-be-gcw1
    deploy:
      kustomize:
        buildArgs:
        - --enable_alpha_plugins
        paths:
        - waas-config/environments/be-gcw1/pp
    activation:
      - command: pp-be-gcw1
  - name: prod-be-gcw1
    deploy:
      kustomize:
        buildArgs:
        - --enable_alpha_plugins
        paths:
        - waas-config/environments/be-gcw1/prod
    activation:
      - command: prod-be-gcw1
