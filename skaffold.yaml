apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: PROJECT_NAME
build:
  artifacts:
    - image: PROJECT_NAME
      docker:
        dockerfile: Dockerfile
  tagPolicy:
    gitCommit:
      variant: AbbrevCommitSha
      ignoreChanges: true
  local:
    push: false
manifests:
  kustomize:
    paths:
      - .
deploy:
  kubectl: {}
  statusCheckDeadlineSeconds: 420
profiles:
  - name: push
    build:
      local:
        push: true
  - name: dev
    manifests:
      kustomize:
        paths:
          - deployment-configuration/profiles/dev
        buildArgs:
          - --enable-alpha-plugins
    deploy:
      kubectl: {}
  - name: pp
    manifests:
      kustomize:
        paths:
          - deployment-configuration/profiles/pp
        buildArgs:
          - --enable-alpha-plugins
    deploy:
      kubectl: {}
  - name: prod
    manifests:
      kustomize:
        paths:
          - deployment-configuration/profiles/prod
        buildArgs:
          - --enable-alpha-plugins
    deploy:
      kubectl: {}
