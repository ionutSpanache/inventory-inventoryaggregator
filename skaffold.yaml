apiVersion: skaffold/v2beta26
kind: Config
metadata:
  name: PROJECT_NAME
build:
  artifacts:
    - image: PROJECT_NAME
      docker:
        dockerfile: Dockerfile
  tagPolicy:
    gitCommit:
      variant: AbbrevCommitSha
      ignoreChanges: true
  local:
    push: false
deploy:
  kustomize: {}
  statusCheckDeadlineSeconds: 240
profiles:
  - name: push
    build:
      local:
        push: true
  - name: dev
    deploy:
      kustomize:
        buildArgs:
          - '--enable-alpha-plugins'
        paths:
          - deployment-configuration/profiles/dev
  - name: pp
    deploy:
      kustomize:
        buildArgs:
          - '--enable-alpha-plugins'
        paths:
          - deployment-configuration/profiles/pp
  - name: prod
    deploy:
      kustomize:
        buildArgs:
          - '--enable-alpha-plugins'
        paths:
          - deployment-configuration/profiles/prod
