apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- service.yaml
generators:
- googleSecretManagerSecretGenerator.yaml
configMapGenerator:
- name: inventoryaggregator
  behavior: merge
  envs:
  - application.properties
patches:
- target:
    kind: Deployment
    name: inventoryaggregator
  path: resources.yaml
- target:
    kind: Deployment
    name: inventoryaggregator
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/envFrom/-
      value:
        secretRef:
          name: inventoryaggregator-google-secret-manager-secrets
