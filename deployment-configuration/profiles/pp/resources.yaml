apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-inventoryaggregator
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: inventoryaggregator
        resources:
          limits:
            cpu: "2"
            memory: 1.5Gi
          requests:
            cpu: 200m
            memory: 800Mi

