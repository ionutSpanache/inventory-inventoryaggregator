apiVersion: apps/v1
kind: Deployment
metadata:
  name: PROJECT_NAME
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: PROJECT_NAME
        resources:
          limits:
            cpu: "2"
            memory: "2.5Gi"
          requests:
            cpu: "300m"
            memory: "1.5Gi"