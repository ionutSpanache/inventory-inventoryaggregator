apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: PROJECT_NAME
spec:
  maxReplicas: 10
  minReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 85
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 150
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: PROJECT_NAME