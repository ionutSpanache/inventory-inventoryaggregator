apiVersion: apps/v1
kind: Deployment
metadata:
  name: PROJECT_NAME
spec:
  template:
    spec:
      containers:
      - name: PROJECT_NAME
        volumeMounts:
          - name: secret
            mountPath: "/etc/secrets"
            readOnly: true
        env:
          - name: ARTICLE_CACHE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: PROJECT_NAME-secret
                key: article_cache_password
          - name: IDAM_CLIENT_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: PROJECT_NAME-secret
                key: idam_client_client_secret
          - name: IDAM_SECRET
            valueFrom:
              secretKeyRef:
                name: PROJECT_NAME-secret
                key: idam_secret
        envFrom:
          - configMapRef:
              name: PROJECT_NAME
          - secretRef:
              name: PROJECT_NAME-application-secrets
      volumes:
      - name: secret
        secret:
          secretName: "PROJECT_NAME-secret"