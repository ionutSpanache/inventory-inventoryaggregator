apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- hpa.yaml
- service.yaml
patches:
  - target:
      kind: Deployment
      name: PROJECT_NAME
    path: resources.yaml
  - target:
      kind: Deployment
      name: PROJECT_NAME
    path: deploymentSecrets.yaml
configMapGenerator:
  - name: PROJECT_NAME
    behavior: merge
    envs:
      - application.properties
