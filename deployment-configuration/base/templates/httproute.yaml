apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: PROJECT_NAME-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inventory-gw
  rules:
    - backendRefs:
        - kind: Service
          name: PROJECT_NAME-svc
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /PROJECT_NAME/.well-known/openapi.json
    - backendRefs:
        - kind: Service
          name: PROJECT_NAME-svc
          port: 80
          weight: 1
      matches:
        - path:
            type: Exact
            value: /PROJECT_NAME/swagger-ui.html
    - backendRefs:
        - kind: Service
          name: PROJECT_NAME-svc
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /PROJECT_NAME/swagger-ui
    - backendRefs:
        - kind: Service
          name: PROJECT_NAME-svc
          port: 80
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              replacePrefixMatch: /
              type: ReplacePrefixMatch
      matches:
        - path:
            type: PathPrefix
            value: /PROJECT_NAME

