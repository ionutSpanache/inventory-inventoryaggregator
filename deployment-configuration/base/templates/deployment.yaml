apiVersion: apps/v1
kind: Deployment
metadata:
  name: PROJECT_NAME
spec:
  selector:
    matchLabels:
      service: PROJECT_NAME
  template:
    metadata:
      labels:
        service: PROJECT_NAME
    spec:
      containers:
      - image: PROJECT_NAME
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /.well-known/live
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: PROJECT_NAME
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /.well-known/ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        env:
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_ENV
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/env']
        - name: DD_SERVICE
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/service']
        - name: DD_VERSION
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/version']
        - name: DD_LOGS_INJECTION
          value: "true"
        - name: DRP_CF_KUBERNETES_MINION_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DRP_CF_KUBERNETES_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: DRP_CF_KUBERNETES_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DRP_CF_KUBERNETES_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DRP_CF_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: COMMIT_SHA
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['repository.commit_sha']
        envFrom:
        - configMapRef:
            name: PROJECT_NAME
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  service: PROJECT_NAME
              topologyKey: "kubernetes.io/hostname"
